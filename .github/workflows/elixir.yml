# documentation.

name: Elixir CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: "1.19.5"
        otp-version: "28.3"
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Prepare and test browser assets
      run: |
        npm ci
        npm run prepare:vendor
        npm test
    - name: Compile browser assets
      run: |
        mix install_minifiers
        mix compile_front
        test -s priv/static/js/app.js
        test -s priv/static/vendor/three.module.js
        test -s priv/static/traversal/view.js
